name: Sync price list and deploy site

on:
  schedule:
    - cron: "17 * * * *" # every hour
  workflow_dispatch: # "Run workflow" button in the Actions tab
  push:
    branches: [main]

# Read-only access to the repo. pages/id-token only allow publishing the website.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install openpyxl==3.1.5

      - name: Build site
        run: |
          mkdir _site
          cp -r index.html js data _site/

      - name: Pull latest prices from the Google Drive sheet
        env:
          PRICELIST_SHEET_URL: ${{ secrets.PRICELIST_SHEET_URL }}
        run: python3 scripts/sync_pricelist.py _site/data

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
